<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VisionAttend | Вход в систему</title>
    <script src="/static/tailwind.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-2xl font-bold text-center text-indigo-400 mb-2">Авторизация</h1>
        <p class="text-center text-gray-400 text-xs mb-6">Active Directory Windows Server</p>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-lg text-sm mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Имя пользователя (AD):</label>
                <input type="text" name="username" required autocomplete="username"
                       placeholder="ivanov_ii"
                       class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-2.5 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Пароль:</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-2.5 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition">
                Войти
            </button>
        </form>
    </div>
</body>
</html>
